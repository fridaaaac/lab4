<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What to Eat Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>What to Eat Today?</h1>
  <p id="status"></p>

  <div id="step1">
    <h2>Question 1: Hot or cold?</h2>
    <button onclick="selectTemp('hot')">Hot</button>
    <button onclick="selectTemp('cold')">Cold</button>
  </div>

  <div id="step2" class="hidden">
    <h2>Question 2: What flavor?</h2>
    <button onclick="selectTaste('spicy')">Spicy</button>
    <button onclick="selectTaste('mild')">Mild</button>
    <button onclick="selectTaste('sweet')">Sweet</button>
  </div>

  <div id="result" class="hidden">
    <h2>Today you should eat:</h2>
    <p id="food"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
